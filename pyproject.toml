[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# ioSuite is one program: this library (iosuite_shared) and a package per app, in one folder and one Python
# environment. Which apps a copy of it runs is said when it starts (`iosuite serve --apps …`, or APPS in the machine's
# config.env), and only those are loaded. So the packages an app needs beyond the suite's own are an extra named after
# it: `pip install -e ".[iocalendar,iotask]"` for two apps, `".[all]"` for every one.
[project]
name = "iosuite"
dynamic = ["version"]  # the suite's one version: iosuite_shared.__version__
description = "Self-hosted apps for the family (ioStart, ioPix, ioNote, ioCalendar, ioContact, ioTask, ioRecipe, ioThings, ioMoney, ioDocs, ioHealth, ioDNS, ioBackup) as one program that runs the apps it is told to"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
  "fastapi<1",
  "uvicorn<1",
  "pymysql<2",
  "python-multipart<1",
  "defusedxml<1",          # request bodies in XML (CalDAV, CardDAV, feeds)
  "mcp<3",                 # every app's MCP server at /mcp
  "argon2-cffi>=23,<26",   # account password hashes (Argon2id)
  "pyjwt[crypto]<3",       # Cloudflare Access tokens (proxy sign-in)
  "cryptography",          # passkey signatures, the suite's own certificate (already there with pyjwt[crypto])
  "fpdf2>=2.7,<3",         # the estate planning PDF (iosuite_shared.estate), ioThings' insurance PDF
  "pypdf>=4,<7",           # the PDFs put into it whole; ioNote, ioDocs, ioMoney read PDFs with it
  "pillow>=10,<13",        # scans and photos made smaller
  "segno>=1.5,<2",         # the QR code a code app reads when two-step sign-in is turned on
  "tzdata",                # time zones on systems without /usr/share/zoneinfo
  "httpx2<3",              # the one HTTP client: a request passed on to another copy of the suite (iosuite_shared.doors), the suite's MCP, ioDNS's providers, ioBackup's Google Drive
]

[project.optional-dependencies]
iostart = ["websockets<16", "python-liquid<4", "uvicorn>=0.29,<1"]
iocalendar = ["icalendar>=6,<8", "recurring-ical-events>=3.8,<4", "python-dateutil>=2.8,<3", "holidays>=0.60,<1"]
iotask = ["icalendar>=6,<8", "python-dateutil>=2.8,<3"]
iocontact = []
ionote = ["pillow-heif<2", "orjson<4", "rapidocr>=2,<4", "onnxruntime<2", "numpy<3"]
iorecipe = []
iorecipe-ai = ["llama-cpp-python>=0.3,<0.4"]
iothings = []
iomoney = ["monarchmoneycommunity>=1.7,<2"]
iodocs = ["zxing-cpp>=2.2,<4"]
iohealth = ["orjson<4"]
iodns = []
iobackup = []
iopix = ["pillow-heif<2", "orjson<4"]
# ioPix's AI features, each optional: what Settings › AI offers depends on which are installed
iopix-search = ["fastembed<1", "huggingface_hub<2", "numpy<3"]
iopix-ocr = ["rapidocr<4", "pyspellchecker<1"]
iopix-objects = ["numpy<3", "onnxruntime<2"]
iopix-captions = ["torch>=2,<3", "transformers>=5,<6"]
iopix-speech = ["onnx-asr<1", "numpy<3", "onnxruntime<2"]
iopix-ai = ["fastembed<1", "huggingface_hub<2", "numpy<3", "rapidocr<4", "pyspellchecker<1", "onnxruntime<2"]
# every app (without the AI extras, which are large)
all = [
  "websockets<16", "python-liquid<4", "uvicorn>=0.29,<1",
  "icalendar>=6,<8", "recurring-ical-events>=3.8,<4", "python-dateutil>=2.8,<3", "holidays>=0.60,<1",
  "pillow-heif<2", "orjson<4", "rapidocr>=2,<4", "onnxruntime<2", "numpy<3",
  "monarchmoneycommunity>=1.7,<2", "zxing-cpp>=2.2,<4",
]
test = ["pytest<10", "httpx<1", "pyflakes<4", "ldap3<3"]  # httpx: what FastAPI's test client needs

[project.scripts]
iosuite = "iosuite_shared.cli:main"

[tool.setuptools.dynamic]
version = {attr = "iosuite_shared.__version__"}

[tool.setuptools.packages.find]
include = ["iosuite_shared*", "iosuite_demo*", "io*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"*" = ["app.json", "static/**/*", "*.liquid", "markup/**/*", "fonts/*", "recipes/*"]
