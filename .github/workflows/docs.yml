name: docs
# The website (iosuite.iothing.net), in docs/: built as .github/workflows/site.yml builds it, then deployed to
# Cloudflare Workers (docs/CLOUDFLARE.md, docs/wrangler.jsonc).
on:
  push:
    branches: [main]
    paths: ["docs/**", "*/app.json", "docker-compose.yml", "proxmox/ct/**", "iosuite_shared/config.py", "README.md", "*/README.md", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: docs
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # a run that hangs is stopped here, not after GitHub's six hours
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: sh build.sh
        env:
          NO_MKDOCS_2_WARNING: "1"
      - name: Deploy to Cloudflare Workers
        # wrangler.jsonc says what; the two repository secrets say where (docs/CLOUDFLARE.md). Without them the run
        # fails here, saying so: a site that silently was not published is worse than a red run
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The site was built but not published: the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set (docs/CLOUDFLARE.md)."
            exit 1
          fi
          npx --yes wrangler@4 deploy
