# What is checked on every push to main and on every pull request: the code parses, every app's tests and the shared
# library's pass against a MariaDB service, and the whole program, installed the way a server installs it and started
# with every app in one copy, answers for each of them on the right port.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python
        run: |
          python -m pip install -q pyflakes
          python -m pyflakes iosuite_shared iosuite_demo io*/ tools
          python -m compileall -q iosuite_shared iosuite_demo io*/ tools
      - name: Every app's manifest
        run: |
          python -m pip install -q -e .
          python -c "from iosuite_shared import catalog; print(len(catalog.APPS), 'apps:', ', '.join(catalog.APPS))"
      - name: JavaScript
        run: |
          # the web apps' files are ES modules: parsed as modules (a plain --check can miss errors); the libraries of others are left alone
          for f in $(find . -path './io*/static/*' -name '*.js' -not -path '*/vendor/*' -not -name '*.min.js'); do
            node --input-type=module --check < "$f" || { echo "::error file=$f::does not parse"; exit 1; }
          done
          node -e 'JSON.parse(require("fs").readFileSync("iostart/static/extension/manifest.json"))'
          for f in iostart/static/extension/*.js iostart/tests/extension/*.js; do node --check "$f"; done
      - name: Shell
        run: |
          sh -n update.sh
          bash -n install.sh
          for f in $(find . -name '*.sh' -not -path './.venv/*' -not -name update.sh); do bash -n "$f"; done
      - name: The edge worker (Cloudflare) and its tests
        working-directory: cloudflare/edge-auth
        run: node --test

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [iosuite_shared, iostart, iocalendar, iotask, iocontact, ionote, iorecipe, iothings, iomoney, iodocs, iohealth, iodns, iobackup, iopix]
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      IOSUITE_TEST_DB: 127.0.0.1:3306:root:root  # scratch databases on the service (iosuite_shared.testing)
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Packages
        run: |
          # the app's own packages only, as on a machine that runs this app alone; the shared library's tests load every app's manifest, no app
          if [ "$PART" = iosuite_shared ]; then extras=test; else extras="$PART,test"; fi
          python -m pip install -q -e ".[$extras]"
          # what the app's manifest says it needs of the system (exiftool, tesseract, …)
          pkgs="$([ -f "$PART/app.json" ] && python -c "import json,sys; print(' '.join(json.load(open(sys.argv[1])).get('system', [])))" "$PART/app.json" || true)"
          # ioDocs' tests draw made-up passports: their zone in its own font (OCR-B), as on a real one
          if [ "$PART" = iodocs ]; then pkgs="$pkgs fonts-ocr-b"; fi
          if [ -n "$pkgs" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $pkgs >/dev/null; fi
      - name: Tests
        run: |
          more=""
          if [ "$PART" = iopix ]; then
            python -m pip install -q numpy  # the search-model switch test builds vectors
            more="--ignore=iopix/tests/ui"   # the browser tests: the job below
          fi
          python -m pytest -q -p no:cacheprovider "$PART/tests" $more
      - name: ioBackup's round trip of every kind of object (backup, drop, restore, compare)
        if: matrix.part == 'iobackup'
        env:
          IOBACKUP_TEST_DB_HOST: 127.0.0.1
          IOBACKUP_TEST_DB_USER: root
          IOBACKUP_TEST_DB_PASSWORD: root
        run: bash iobackup/tests/integration.sh

  iopix-browser:
    # ioPix's pages in a real browser (Playwright, headless Chromium), on a library the tests make from scratch
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      IOSUITE_TEST_DB: 127.0.0.1:3306:root:root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Packages
        run: |
          python -m pip install -q -e ".[iopix,test]" numpy playwright
          pkgs="$(python -c "import json; print(' '.join(json.load(open('iopix/app.json')).get('system', [])))")"
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $pkgs >/dev/null
          python -m playwright install --with-deps chromium >/dev/null
      - name: Browser tests
        run: python -m pytest -q -p no:cacheprovider iopix/tests/ui

  one-copy:
    # installed as a server installs it (the program's environment, `iosuite install`, the databases made with a
    # MariaDB administrator), then every app in one copy, asked from outside
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        env:
          DB_ADMIN_PASSWORD: root
          ADMIN_PASSWORD: a-password-for-the-check
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q -e .
          .venv/bin/iosuite install --yes --apps all --db 127.0.0.1 --db-admin root --client-host % --admin alex --no-service --port 8080 --sync-port 8443 --mcp-port 8444
          .venv/bin/iosuite install --list
      - name: Every app answers in one copy
        run: |
          .venv/bin/iosuite serve > serve.log 2>&1 &
          echo $! > serve.pid
          python tools/smoke.py --web 8080 --sync 8443 || { tail -100 serve.log; exit 1; }
      - name: Two apps taken out, then put back
        run: |
          .venv/bin/iosuite install --yes --remove iodns,iobackup --no-service
          .venv/bin/iosuite install --list | tee list.txt
          if grep -q "ioDNS" list.txt; then echo "::error::ioDNS is still in the list"; exit 1; fi
          .venv/bin/iosuite install --yes --add iodns,iobackup --no-service
          .venv/bin/iosuite install --list | grep -q "ioDNS"
      - name: Two copies, one suite (ioPix in a copy of its own)
        env:
          ADMIN_PASSWORD: a-password-for-the-check
        run: |
          kill "$(cat serve.pid)"; while kill -0 "$(cat serve.pid)" 2>/dev/null; do sleep 1; done
          .venv/bin/iosuite install --yes --copy pix --apps iopix --no-service
          .venv/bin/iosuite install --list
          .venv/bin/iosuite set suite PUBLIC_URL http://127.0.0.1:8080
          .venv/bin/iosuite serve > serve.log 2>&1 &
          IOSUITE_CONFIG="$PWD/copies/pix/config.env" .venv/bin/iosuite serve > serve-pix.log 2>&1 &
          python tools/twocopies.py --web 8080 --other-web 8081 --other-app iopix --login "alex:$ADMIN_PASSWORD" || { tail -60 serve.log serve-pix.log; exit 1; }

  move:
    # tools/convert, which moves an install of the first ioSuite to this program: its own tests, then two rehearsals.
    # An install of the first ioSuite is made from its code (the version this program was ported from) and filled
    # with its demo data, convert.py --apply moves it, and what every app lists is held to what it listed before:
    # once without services, once as root with the old apps as systemd services, the way a server is moved (a move
    # that fails first and must put the old services back, the move, and going back)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      IOSUITE_TEST_DB: 127.0.0.1:3306:root:root
      FIRST: 42cc107e82dad474e2619954c02cac1dd29e327e  # ioSuite 3.44.0 (tools/convert/convert.py, PORTED_FROM)
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          # the machine's own Python, in an environment: what a server has, and what a service can start
          pkgs="$(python3 -c "import glob,json; print(' '.join(sorted({p for f in glob.glob('io*/app.json') for p in json.load(open(f)).get('system', [])})))")"
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-venv $pkgs >/dev/null
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -q -e ".[all,test]"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: The converter's tests
        run: python -m pytest -q -p no:cacheprovider tools/convert
      - name: The first ioSuite's code
        id: first
        run: |
          mkdir "$RUNNER_TEMP/first" && cd "$RUNNER_TEMP/first"
          git init -q && git remote add origin https://github.com/avandeputte/iosuite.git
          if GIT_TERMINAL_PROMPT=0 git fetch -q --depth 1 origin "$FIRST" && git checkout -q FETCH_HEAD; then
            echo "there=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The first repository cannot be read from here, so the rehearsals of the move were left out"
          fi
      - name: A rehearsal of the move
        if: steps.first.outputs.there == '1'
        run: |
          python tools/convert/rehearse.py --old "$RUNNER_TEMP/first" --work "$RUNNER_TEMP/rehearse" || {
            tail -n 40 "$RUNNER_TEMP"/rehearse/*.log "$RUNNER_TEMP"/rehearse/old/*/run.log; exit 1; }
      - name: The same with services, as a server is moved (a move that fails, the move, going back)
        if: steps.first.outputs.there == '1'
        run: |
          sudo env "PATH=$PATH" "IOSUITE_TEST_DB=$IOSUITE_TEST_DB" python tools/convert/rehearse.py --service --old "$RUNNER_TEMP/first" --work "$RUNNER_TEMP/rehearse-service" || {
            sudo tail -n 60 "$RUNNER_TEMP"/rehearse-service/*.log; sudo journalctl -u iosuite -u iostart -n 60 --no-pager; exit 1; }

  image:
    # the container image, built as the Image workflow builds it, and the repository's stack file started with it:
    # MariaDB and one container with every app, then ioPix moved to a container of its own
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -q -t ghcr.io/avandeputte/iosuite2:latest --build-arg COMMIT=${{ github.sha }} .
      - name: The stack starts (docker-compose.yml)
        run: |
          mkdir -p stack/data photos && sudo chown 1000:1000 stack/data photos
          cat > .env <<EOF
          SUITE_DB_PASSWORD=a-login-for-the-check
          DB_ROOT_PASSWORD=a-root-for-the-check
          ADMIN_USER=alex
          ADMIN_PASSWORD=a-password-for-the-check
          DATA=$PWD/stack
          PHOTOS=$PWD/photos
          EOF
          docker compose up -d --wait --wait-timeout 300 || { docker compose ps; docker compose logs --no-log-prefix --tail 80 iosuite; exit 1; }
          docker compose logs --no-log-prefix iosuite | head -20
      - name: Every app answers in the container
        run: python3 tools/smoke.py --web 80 --sync 8443 || { docker compose logs --no-log-prefix --tail 100 iosuite; exit 1; }
      - name: Two containers, one suite (ioPix in a container of its own)
        run: |
          cat > two.yml <<'EOF'
          services:
            iosuite:
              environment:
                APPS: "iostart,iocalendar,iotask,iocontact,ionote"
              command: [iosuite, stack, --db-admin=root, --set=suite.PUBLIC_URL=http://127.0.0.1, --, iosuite, serve]
              healthcheck:
                interval: 5s
            iopix:
              image: ghcr.io/avandeputte/iosuite2:latest
              restart: unless-stopped
              depends_on:
                iosuite:
                  condition: service_healthy
              ports: ["8081:80"]
              volumes:
                - ${DATA}/data:/data
                - ${PHOTOS}:/library/photos
              environment:
                IOSUITE_DB_HOST: db
                IOSUITE_DB_PASSWORD: ${SUITE_DB_PASSWORD}
                DB_ADMIN_PASSWORD: ${DB_ROOT_PASSWORD}
                INTERNAL_URL: http://iopix
                APPS: iopix
                LOG_FILE: /data/iosuite-pix.log
              command: [iosuite, stack, --db-admin=root, --, iosuite, serve]
              healthcheck:
                interval: 5s
          EOF
          docker compose -f docker-compose.yml -f two.yml up -d --wait --wait-timeout 300 || { docker compose -f docker-compose.yml -f two.yml ps; docker compose -f docker-compose.yml -f two.yml logs --no-log-prefix --tail 60 iosuite iopix; exit 1; }
          python3 tools/twocopies.py --web 80 --other-web 8081 --other-app iopix --app iocalendar --login "alex:a-password-for-the-check" || { docker compose -f docker-compose.yml -f two.yml logs --no-log-prefix --tail 60 iosuite iopix; exit 1; }
